name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run static checks
        run: make static-check

  test-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install shared-mime-info
        run: sudo apt-get update && sudo apt-get install -y shared-mime-info

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.99.1

      - name: Run tests that need outside software
        run: make test-external
