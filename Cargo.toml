[package]
name = "hali"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Keeps a standards-based RDF ontology describing local files in place"
publish = false

[features]
# Compiles in HALI_TEST_NOW / HALI_TEST_ID_SEED (spec §14.2). Never enabled in release builds.
test-hooks = []
# Gates the red tests of the active PR goal (see "AI loop" in AGENTS.md); stays as the mechanism after settle.
goal = []

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
oxigraph = { version = "=0.5.13", default-features = false }
oxrdf = "=0.3.5"
oxttl = "=0.2.5"
rudof_rdf = "=0.3.35"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
shacl = "=0.3.35"
toml = "=1.1.8"
uuid = { version = "=1.29.0", features = ["v7"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = "=1.49.0"
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
